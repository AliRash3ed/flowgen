<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gradEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FlowGen 4-Pointed Star Compass Emblem -->
  <g transform="translate(60, 60)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradBrand)" stroke-width="2.5" opacity="0.35" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="35" fill="#0f1117" stroke="url(#gradBrand)" stroke-width="1.8" />
    
    <!-- 4-Pointed Star Points -->
    <path d="M 0 -38 Q 4 -12 28 0 Q 4 12 0 38 Q -4 12 -28 0 Q -4 -12 0 -38 Z" fill="url(#gradBrand)" filter="url(#glow)" />
    
    <!-- Center Core Badge -->
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="5.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FG</text>
  </g>

  <!-- Wordmark: FLOW GEN -->
  <g transform="translate(130, 72)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">FLOW</text>
    <text x="135" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#gradBrand)" letter-spacing="-1">GEN</text>
    
    <!-- Version Tag -->
    <rect x="250" y="-32" width="46" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="273" y="-17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">v1.0</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(132, 94)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="3">UNLIMITED IMAGE GENERATION API BRIDGE</text>
  </g>
</svg>
