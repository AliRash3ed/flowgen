<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrandLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- FlowGen 4-Pointed Star Compass Emblem -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradBrandLight)" stroke-width="2.5" opacity="0.3" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="35" fill="#f8fafc" stroke="url(#gradBrandLight)" stroke-width="1.8" />
    
    <path d="M 0 -38 Q 4 -12 28 0 Q 4 12 0 38 Q -4 12 -28 0 Q -4 -12 0 -38 Z" fill="url(#gradBrandLight)" />
    
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="0" y="5.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">FG</text>
  </g>

  <!-- Wordmark: FLOW GEN -->
  <g transform="translate(130, 72)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">FLOW</text>
    <text x="135" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#gradBrandLight)" letter-spacing="-1">GEN</text>
    
    <!-- Version Tag -->
    <rect x="250" y="-32" width="46" height="22" rx="6" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="273" y="-17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">v1.0</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(132, 94)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#475569" letter-spacing="3">UNLIMITED IMAGE GENERATION API BRIDGE</text>
  </g>
</svg>
